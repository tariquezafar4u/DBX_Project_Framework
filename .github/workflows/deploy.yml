name: Deploy DAT-EDIP Framework to Databricks

# Simple single-environment deployment: push to main deploys straight to the
# one Databricks workspace configured via repo secrets.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout DAT-EDIP framework
        uses: actions/checkout@v4

      - name: Checkout data contracts
        uses: actions/checkout@v4
        with:
          repository: tariquezafar4u/DBX_Data_Contract
          ref: main
          path: data-contract-repo

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.18.0

      - name: Verify Databricks deployment credentials
        run: |
          test -n "$DATABRICKS_HOST" || { echo "::error::Set the DATABRICKS_HOST GitHub Actions secret."; exit 1; }
          test -n "$DATABRICKS_TOKEN" || { echo "::error::Set the DATABRICKS_TOKEN GitHub Actions secret."; exit 1; }
          databricks version

      - name: Sync framework source to Databricks Workspace
        run: |
          databricks workspace import-dir . /Shared/dat_edip_framework --overwrite

      - name: Sync data contracts to Databricks Workspace
        run: |
          test -f data-contract-repo/contracts/employee_details/contract.yaml
          test -f data-contract-repo/contracts/department_details/contract.yaml
          grep -q '^product_name: department$' data-contract-repo/contracts/department_details/contract.yaml
          databricks workspace import-dir data-contract-repo /Shared/data_contract_repo --overwrite
          databricks workspace list /Shared/data_contract_repo/contracts/employee_details | grep -q contract.yaml
          databricks workspace list /Shared/data_contract_repo/contracts/department_details | grep -q contract.yaml

      - name: Deploy and run both DAT-EDIP jobs
        run: |
          databricks bundle deploy --target vscodedev
          databricks bundle run employee_pipeline --target vscodedev
          databricks bundle run department_pipeline --target vscodedev

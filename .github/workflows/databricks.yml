bundle:
  name: learning-dat-edip-framework

workspace:
  # Keep the source path alongside the user-scoped bundle deployment.
  file_path: /Workspace/Users/tariquemdzafar@outlook.com/dat_edip_framework

sync:
  exclude:
    - ".github/**"

variables:
  contract_repo_root:
    default: /Workspace/Shared/data_contract_repo
  framework_root:
    default: /Workspace/Users/tariquemdzafar@outlook.com/dat_edip_framework

resources:
  jobs:
    employee_pipeline:
      name: dat_edip_learning_pipeline_employee_details
      tasks:
        - task_key: volume_to_volume
          notebook_task:
            notebook_path: ./notebooks/01_volume_to_volume.py
            base_parameters:
              product_name: employee_details
              contract_repo_root: ${var.contract_repo_root}
              framework_root: ${var.framework_root}
        - task_key: raw_manager
          depends_on:
            - task_key: volume_to_volume
          notebook_task:
            notebook_path: ./notebooks/02_raw_manager.py
            base_parameters:
              product_name: employee_details
              contract_repo_root: ${var.contract_repo_root}
              framework_root: ${var.framework_root}
        - task_key: stage_manager
          depends_on:
            - task_key: raw_manager
          notebook_task:
            notebook_path: ./notebooks/03_stage_manager.py
            base_parameters:
              product_name: employee_details
    department_pipeline:
      name: dat_edip_learning_pipeline_department_details
      tasks:
        - task_key: volume_to_volume
          notebook_task:
            notebook_path: ./notebooks/01_volume_to_volume.py
            base_parameters:
              product_name: department_details
              contract_repo_root: ${var.contract_repo_root}
              framework_root: ${var.framework_root}
        - task_key: raw_manager
          depends_on:
            - task_key: volume_to_volume
          notebook_task:
            notebook_path: ./notebooks/02_raw_manager.py
            base_parameters:
              product_name: department_details
              contract_repo_root: ${var.contract_repo_root}
              framework_root: ${var.framework_root}
        - task_key: stage_manager
          depends_on:
            - task_key: raw_manager
          notebook_task:
            notebook_path: ./notebooks/03_stage_manager.py
            base_parameters:
              product_name: department_details
              contract_repo_root: ${var.contract_repo_root}
              framework_root: ${var.framework_root}
              contract_repo_root: ${var.contract_repo_root}
              framework_root: ${var.framework_root}

targets:
  vscodedev:
    mode: development
    default: true